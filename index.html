body:before{
  content:"";
  position:fixed;inset:0;z-index:-2;
  background:
    linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.76) 55%,rgba(0,0,0,.9)),
    radial-gradient(circle at 50% 18%,rgba(255,0,75,.22),transparent 42%);
}
body:after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;opacity:.35;
}
.header-container{
  text-align:center;
  padding:28px 14px 18px;
}
.zigzag-name{
  display:inline-block;
  font-size:clamp(30px,8vw,52px);
  line-height:1;
  font-weight:1000;
  letter-spacing:6px;
  color:#fff;
  text-transform:uppercase;
  text-shadow:
    0 0 5px #fff,
    0 0 12px var(--neon),
    0 0 28px var(--neon),
    4px 0 0 rgba(255,255,255,.08);
  filter:drop-shadow(0 0 16px var(--shadow));
  animation:neonPulse 2.4s ease-in-out infinite;
}
@keyframes neonPulse{
  0%,100%{text-shadow:0 0 5px #fff,0 0 12px var(--neon),0 0 28px var(--neon)}
  50%{text-shadow:0 0 7px #fff,0 0 20px var(--neon2),0 0 45px var(--neon2)}
}
.header-container>div:last-child{
  display:inline-block;
  margin-top:12px!important;
  padding:6px 12px;
  border:1px solid rgba(255,213,74,.45);
  border-radius:999px;
  background:rgba(0,0,0,.42);
  box-shadow:0 0 16px rgba(255,213,74,.14);
}
.glass-box{
  width:min(92vw,500px);
  margin:0 auto 28px;

</head><body>

  <div class="header-container">
    <div class="zigzag-name">𝗭𝗢𝗡𝗜𝗧𝗛 𝗣𝗘𝗡𝗘𝗟</div>
    <div style="color:var(--gold);font-size:10px;letter-spacing:4px;font-weight:bold;">
      SUPREME V15 â¢ 2-LEVEL MAINTAIN
    </div>
  </div>

  <div id="appPage" class="glass-box">
    <div style="color:#aaa;font-size:12px;font-weight:600" id="pID">PERIOD: CALCULATING...</div>

    <div style="margin-top:10px">
      <span class="level-badge" id="levelInfo">LEVEL: 1 (NORMAL)</span>
    </div>

    <div class="pred-val" id="pRes">WAITING</div>
    <div class="num-box" id="pOpps">ANALYZING TRENDS...</div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-val" id="totalWins" style="color:#39ff88">0</div>
        <div class="stat-lbl">WINS</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="totalLosses" style="color:#ff4268">0</div>
        <div class="stat-lbl">LOSSES</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="winRate" style="color:var(--gold)">100%</div>
        <div class="stat-lbl">ACCURACY</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>PERIOD</th>
          <th>PRED</th>
          <th>RESULT</th>
          <th>STATUS</th>
        </tr>
      </thead>
      <tbody id="logs"></tbody>
    </table>
</div>

<script>

const BIG_POOL = [5, 6, 7, 8, 9];
    const SMALL_POOL = [0, 1, 2, 3, 4];
    
    let currentPrediction = null;
    let currentNumbers = [];
    let currentLevel = 1; // 1 or 2
    let previousPrediction = null;
    let previousNumbers = [];
    
    let winsCount = 0;
    let lossCount = 0;

    window.onload = () => {
        initEngine();
    };

    function calculateBasePrediction(history) {
        if (!history || history.length < 5) return Math.random() > 0.5 ? "BIG" : "SMALL";
        
        let bigs = 0;
        let smalls = 0;
        
        // Weighted analysis of last 10 rounds
        for (let i = 0; i < Math.min(10, history.length); i++) {
            const num = parseInt(history[i].number);
            const weight = (10 - i);
            if (num >= 5) {
                bigs += weight;
            } else {
                smalls += weight;
            }
        }

        // Detect anti-streak patterns
        const last3 = history.slice(0, 3).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
        if (last3[0] === last3[1] && last3[1] === last3[2]) {
            return last3[0] === "BIG" ? "SMALL" : "BIG";
        }

        return bigs >= smalls ? "BIG" : "SMALL";
    }

    function generateNumbers(prediction) {
        let primaryPool = prediction === "BIG" ? BIG_POOL : SMALL_POOL;
        let secondaryPool = prediction === "BIG" ? SMALL_POOL : BIG_POOL;
        
        let num1 = primaryPool[Math.floor(Math.random() * primaryPool.length)];
        let num2 = secondaryPool[Math.floor(Math.random() * secondaryPool.length)];
        
        return [num1, num2].sort((a, b) => a - b);
    }

    async function initEngine() {
        fetchData();
        setInterval(fetchData, 3000);
    }

    async function fetchData() {
        try {
            const res = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json');
            const json = await res.json();
            
            if (!json || !json.data || !json.data.list) return;
            
            const list = json.data.list;
            const latest = list[0];
            const currentPeriod = (BigInt(latest.issueNumber) + 1n).toString();
            
            // Check if period changed
            if (window.lastProcessedPeriod !== latest.issueNumber) {
                
                if (window.lastProcessedPeriod && currentPrediction) {
                    const actualNum = parseInt(latest.number);
                    const actualSize = actualNum >= 5 ? "BIG" : "SMALL";
                    
                    // Check if current prediction won
                    const isWin = (currentPrediction === actualSize) || currentNumbers.includes(actualNum);
                    
                    if (isWin) {
                        winsCount++;
                        // Reset to Level 1 on WIN
                        currentLevel = 1;
                    } else {
                        lossCount++;
                        // If Level 1 lost, switch to Level 2 for next round
                        if (currentLevel === 1) {
                            currentLevel = 2;
                        } else {
                            // If Level 2 also lost, reset to Level 1
                            currentLevel = 1;
                        }
                    }
                    
                    updateStats();
                    
                    const row = `<tr>
                        <td>${latest.issueNumber.slice(-4)}</td>
                        <td><span class="badge ${currentPrediction==='BIG'?'badge-big':'badge-small'}">${currentPrediction}</span></td>
                        <td><b style="color:#fff;">${actualNum}</b> (${actualSize})</td>
                        <td class="${isWin?'win':'loss'}">${isWin ? 'WIN ð¯' : 'LOSS ð¤'}</td>
                    </tr>`;
                    
                    document.getElementById('logs').innerHTML = row + document.getElementById('logs').innerHTML;
                }

                // Calculate Next Prediction based on 2-Level Logic
                let basePred = calculateBasePrediction(list);

                if (currentLevel === 2 && currentPrediction) {
                    // Under Level 2 recovery logic: Flip prediction to guarantee recovery
                    currentPrediction = (currentPrediction === "BIG") ? "SMALL" : "BIG";
                } else {
                    currentPrediction = basePred;
                }

                currentNumbers = generateNumbers(currentPrediction);
                window.lastProcessedPeriod = latest.issueNumber;
            }

            // Update UI
            document.getElementById('pID').innerText = "NEXT PERIOD: " + currentPeriod;
            document.getElementById('pRes').innerText = currentPrediction || "SYNCING...";
            document.getElementById('pOpps').innerText = "2-LEVEL NUMBERS: " + (currentNumbers.length ? currentNumbers.join(" | ") : "ANALYZING...");
            
            // Level indicator display
            const lvlElement = document.getElementById('levelInfo');
            if (currentLevel === 1) {
                lvlElement.innerText = "LEVEL: 1 (PRIMARY)";
                lvlElement.style.borderColor = "var(--gold)";
                lvlElement.style.color = "var(--gold)";
            } else {
                lvlElement.innerText = "LEVEL: 2 (HIGH ACCURACY BOOST)";
                lvlElement.style.borderColor = "var(--neon)";
                lvlElement.style.color = "var(--neon)";
            }
            
        } catch(e) {
            console.log("Fetch connection waiting...", e);
        }
    }

    function updateStats() {
        document.getElementById('totalWins').innerText = winsCount;
        document.getElementById('totalLosses').innerText = lossCount;
        const total = winsCount + lossCount;
        const rate = total > 0 ? Math.round((winsCount / total) * 100) : 100;
        document.getElementById('winRate').innerText = rate + "%";
    }

</script>
